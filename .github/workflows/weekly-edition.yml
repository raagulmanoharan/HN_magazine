name: Weekly Edition

on:
  schedule:
    # Every Sunday at 11:00 + 12:00 UTC (7 AM ET, DST-safe)
    - cron: "0 11 * * 0"
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      public_url: ${{ steps.meta.outputs.public_url }}
      issue_date: ${{ steps.meta.outputs.issue_date }}
      applies_count: ${{ steps.meta.outputs.applies_count }}
      tagline: ${{ steps.meta.outputs.tagline }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute Pages base URL
        id: base
        run: |
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build weekly issue
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          set -euo pipefail
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/build_weekly.py $DATE_ARG --no-notify | tee build-result.json

      - name: Extract build metadata
        id: meta
        run: |
          date=$(python -c "import json;print(json.load(open('build-result.json'))['date'])")
          applies=$(python -c "import json;print(json.load(open('build-result.json'))['applies_count'])")
          tagline=$(python -c "import json;print(json.load(open('build-result.json'))['tagline'])")
          echo "issue_date=$date" >> "$GITHUB_OUTPUT"
          echo "applies_count=$applies" >> "$GITHUB_OUTPUT"
          echo "tagline=$tagline" >> "$GITHUB_OUTPUT"
          echo "public_url=${{ steps.base.outputs.url }}/magazines/weekly-$date.html" >> "$GITHUB_OUTPUT"

      - name: Commit generated issue
        run: |
          set -euo pipefail
          git config user.name "morning-edition-bot"
          git config user.email "morning-edition-bot@users.noreply.github.com"
          git add magazines/ index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly Edition: ${{ steps.meta.outputs.issue_date }}"
          git pull --rebase origin ${GITHUB_REF#refs/heads/}
          git push origin HEAD:${GITHUB_REF#refs/heads/}

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install twilio
      - name: Wait for Pages
        env:
          URL: ${{ needs.build.outputs.public_url }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "attempt $i: $URL -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Pages did not serve $URL after 5 minutes; sending link anyway."
      - name: Send WhatsApp
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python scripts/notify.py \
            "${{ needs.build.outputs.public_url }}" \
            "Weekly — ${{ needs.build.outputs.issue_date }}" \
            "${{ needs.build.outputs.applies_count }}" \
            "${{ needs.build.outputs.tagline }}"
