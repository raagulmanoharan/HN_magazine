name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check current Pages config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Current Pages config ==="
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | tee /tmp/pages-before.json
          echo ""

      - name: Set Pages source to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Setting Pages source to gh-pages ==="
          HTTP_CODE=$(curl -s -o /tmp/pages-response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/pages-response.json
          echo ""

          echo "=== Pages config after update ==="
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | tee /tmp/pages-after.json
          echo ""

          # Save status for diagnosis
          echo "{\"before\":$(cat /tmp/pages-before.json),\"api_response\":$(cat /tmp/pages-response.json),\"http_code\":\"$HTTP_CODE\",\"after\":$(cat /tmp/pages-after.json)}" > pages-diagnostic.json

      - name: Push to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf .github scripts .gitignore requirements.txt taste.json README.md
          cp /tmp/pages-before.json pages-diagnostic.json || true
          git checkout --orphan gh-pages-build
          git add -A
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages-build:gh-pages --force
