name: Morning Edition

on:
  schedule:
    # 7:00 AM US Eastern = 11:00 UTC (standard) / 12:00 UTC (daylight).
    # GitHub cron does not understand DST. We run at both so the reader
    # always gets the issue by 07:00 local, regardless of season. The
    # downstream build step is idempotent within a day (it overwrites
    # the same YYYY-MM-DD.html) so running twice is harmless.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/morning-edition.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute Pages base URL
        id: base
        run: |
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build today's issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          set -euo pipefail
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/build.py $DATE_ARG

      - name: Commit generated issue
        run: |
          set -euo pipefail
          git config user.name "morning-edition-bot"
          git config user.email "morning-edition-bot@users.noreply.github.com"
          git add magazines/ index.html feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          date=$(python -c "import json,pathlib;d=[p.stem for p in sorted(pathlib.Path('magazines').glob('[0-9]*.html'),reverse=True)];print(d[0] if d else 'unknown')")
          git commit -m "Morning Edition: $date"
          git pull --rebase origin ${GITHUB_REF#refs/heads/}
          git push origin HEAD:${GITHUB_REF#refs/heads/}
